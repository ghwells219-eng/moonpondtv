name: Update latest videos

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Moon Pond Kids YouTube feed
        run: |
          python3 - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET
          url = "https://www.youtube.com/feeds/videos.xml?channel_id=UC9nZIP9U75sQQwKuowFO5Mw"
          ns = {"a": "http://www.w3.org/2005/Atom", "yt": "http://www.youtube.com/xml/schemas/2015"}
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          root = ET.fromstring(urllib.request.urlopen(req, timeout=30).read())
          out = []
          for e in root.findall("a:entry", ns):
              out.append({
                  "id": e.find("yt:videoId", ns).text,
                  "title": e.find("a:title", ns).text,
                  "published": e.find("a:published", ns).text,
                  "url": e.find("a:link", ns).get("href"),
              })
          if out:
              with open("videos.json", "w") as f:
                  json.dump(out, f, indent=1)
                  f.write("\n")
          print(len(out), "videos")
          PY
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- videos.json; then
            git config user.name "moonpond-bot"
            git config user.email "actions@users.noreply.github.com"
            git add videos.json
            git commit -m "Update latest videos"
            git push
          fi
